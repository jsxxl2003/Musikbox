workflows:
  musikbox-windows-test:
    name: Musikbox-Werkstatt v0.64 Windows EXE Test
    instance_type: linux
    max_build_duration: 60
    environment:
      vars:
        DOTNET_ROOT: "$HOME/.dotnet"
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    scripts:
      - name: Install .NET 8 SDK
        script: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 8.0 --install-dir "$HOME/.dotnet"
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --info
      - name: Publish Windows x64 executable
        script: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet publish Quellcode/MusikboxWerkstatt.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o "$CM_BUILD_DIR/build-output"
          test -f "$CM_BUILD_DIR/build-output/Musikbox-Werkstatt-Studio.exe"
          ls -lh "$CM_BUILD_DIR/build-output/Musikbox-Werkstatt-Studio.exe"
    artifacts:
      - build-output/**
