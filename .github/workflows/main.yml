name: Musikbox-Werkstatt Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode herunterladen
        uses: actions/checkout@v4

      - name: .NET 8 installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Windows-Anwendung erstellen
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '[\\/](Tests|obj|bin)[\\/]' })

          $project = $projects | Where-Object {
            (Get-Content $_.FullName -Raw) -match 'WindowsDesktop|UseWindowsForms'
          } | Select-Object -First 1

          if (-not $project) {
            throw "Kein Windows-Forms-Projekt gefunden."
          }

          Write-Host "Projekt: $($project.FullName)"
          dotnet publish "$($project.FullName)" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE\build-output"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\build-output" -Filter *.exe |
            Where-Object { $_.Name -notmatch '^(ffmpeg|ffprobe|yt-dlp)' } |
            Select-Object -First 1

          if (-not $exe) { throw "Keine ausführbare Anwendung erstellt." }
          Write-Host "Erstellte EXE: $($exe.FullName)"

      - name: Portable Windows-Version bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Musikbox-Werkstatt-Windows-Portable
          path: build-output/
          if-no-files-found: error
