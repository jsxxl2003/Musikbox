name: Musikbox-Werkstatt Windows Build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: musikbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      MUSIKBOX_QS_OUTPUT: ${{ github.workspace }}/qs-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Release-Build
        shell: pwsh
        run: |
          dotnet build MusikboxWerkstatt.csproj -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Regression und Sprachsitzungen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qs-output | Out-Null
          foreach ($test in @('v061/Regression61.csproj','v064/Voice64.csproj','v064/TagEditing.csproj')) {
            $name = [IO.Path]::GetFileNameWithoutExtension($test)
            dotnet run --project $test -c Release -p:NuGetAudit=false 2>&1 | Tee-Object "qs-output/$name.txt"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Windows-Steuerelemente und Navigation
        shell: pwsh
        run: |
          dotnet run --project v064/QS-Windows.csproj -c Release -p:NuGetAudit=false 2>&1 | Tee-Object qs-output/QS-Windows.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project v064/Workspace64.csproj -c Release -p:NuGetAudit=false 2>&1 | Tee-Object qs-output/Workspace64.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows-Publish
        shell: pwsh
        run: |
          dotnet publish MusikboxWerkstatt.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:NuGetAudit=false -o build-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Werkzeug-Cache
        id: tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/MW-Werkzeuge
          key: mw-tools-win64-stable-v1
          restore-keys: |
            mw-tools-win64-
      - name: Nur fehlendes Sherpa-Sprachmodell ergänzen
        shell: pwsh
        run: ./Sherpa-Modell.ps1 -Ziel "$env:GITHUB_WORKSPACE/build-output/Werkzeuge"
      - name: Sicherheitspruefung und SHA256-Dateiliste
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'build-output'
          $defender = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (-not (Test-Path $defender)) {
            $candidates = @(Get-ChildItem 'C:/ProgramData/Microsoft/Windows Defender/Platform' -Filter MpCmdRun.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending)
            if ($candidates.Count -gt 0) { $defender = $candidates[0].FullName }
          }
          if (-not (Test-Path $defender)) { throw 'Windows Defender nicht verfuegbar; Paket wird nicht ausgeliefert.' }
          & $defender -Scan -ScanType 3 -File $root -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Windows Defender Scan fehlgeschlagen (Code $LASTEXITCODE). Keine Auslieferung." }
          $files = @(Get-ChildItem $root -File -Recurse | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object FullName)
          $lines = foreach ($file in $files) {
            $relative = $file.FullName.Substring($root.Length + 1).Replace('\\','/')
            "$(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $relative"
          }
          $lines | Set-Content -Path (Join-Path $root 'SHA256SUMS.txt') -Encoding utf8
          Write-Host "Defender-Scan erfolgreich; $($files.Count) Dateien mit SHA256 protokolliert."
      - name: Programm mit Sherpa-Sprachmodell ausliefern
        uses: actions/upload-artifact@v4
        with:
          name: MW-064-Programm
          path: build-output/
          if-no-files-found: error
      - name: Sherpa-Modell auch im vorhandenen Werkzeugpaket bereitstellen
        if: steps.tools.outputs.cache-matched-key != ''
        shell: pwsh
        run: ./Sherpa-Modell.ps1 -Ziel "$env:RUNNER_TEMP/MW-Werkzeuge"
      - name: Vollstaendiges Paket und Entpackpruefung
        if: steps.tools.outputs.cache-matched-key != ''
        shell: pwsh
        run: ./Bauen.ps1 -WerkzeugePfad "$env:RUNNER_TEMP/MW-Werkzeuge" -PublishOrdner "$env:GITHUB_WORKSPACE/build-output" -Pruefprotokolle "$env:GITHUB_WORKSPACE/qs-output" -Ausgabeordner "$env:RUNNER_TEMP/Paket"
      - name: Komplettpaket MW-064
        if: steps.tools.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@v4
        with:
          name: MW-064
          path: ${{ runner.temp }}/Paket/MW/
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
      - name: Fehlerprotokolle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MW-Fehlerprotokolle
          path: |
            qs-output/
          if-no-files-found: warn
